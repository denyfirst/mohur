name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No third-party actions. The checkout's short-lived token is used only to
# fetch, never stored in git configuration; tools are pinned by version or hash.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      - name: Use the Go toolchain go.mod names
        run: echo "GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)" >> "${GITHUB_ENV}"

      - name: Verify the toolchain and module files
        run: |
          set -eu
          test "$(go env GOVERSION)" = "${GOTOOLCHAIN}"
          go mod tidy
          test -z "$(git status --porcelain)"
          go mod verify
          go list -deps -test ./... > "${RUNNER_TEMP}/mohur-dependencies"
          if grep -qE '^golang.org/x/crypto/openpgp($|/)' "${RUNNER_TEMP}/mohur-dependencies"; then
            echo 'unmaintained OpenPGP dependency is forbidden' >&2
            exit 1
          fi

      - name: Format, vet, race-test and build
        run: |
          set -eu
          test -z "$(gofmt -l cmd internal web)"
          go vet ./...
          go test -race -shuffle=on -count=1 -timeout=5m ./...
          for platform in linux darwin windows; do
            GOOS="${platform}" go vet ./...
            GOOS="${platform}" go build -trimpath ./...
          done

      - name: Install the pinned Node
        run: |
          set -eu
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.3 \
            https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.xz \
            --output "${RUNNER_TEMP}/mohur-node.tar.xz"
          printf '%s  %s\n' 5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864 \
            "${RUNNER_TEMP}/mohur-node.tar.xz" | sha256sum -c -
          tar -xf "${RUNNER_TEMP}/mohur-node.tar.xz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/node-v26.13.1-linux-x64/bin" >> "${GITHUB_PATH}"

      - name: Run the app's tests against two real servers
        env:
          # The tests need libsignal, not the Electron binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -eu
          test "$(node --version)" = v26.13.1
          # The app window and the admin pages run only in a browser, so no
          # test loads them: check that each script at least parses.
          git ls-files 'client/src/*.mjs' 'client/src/*.cjs' 'web/*.mjs' | while read -r script; do
            node --check "${script}" || exit 1
          done
          cd client
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
          node --test test/
          test -z "$(git status --porcelain)"

  install:
    name: Install on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      - name: Install, set up, upgrade and check the sandbox
        run: |
          set -eu
          GOTOOLCHAIN="go$(sed -n 's/^go //p' go.mod)"
          export GOTOOLCHAIN
          sh scripts/install-lab.sh

  release-linux:
    name: Release build on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sums: ${{ steps.build.outputs.sums }}
    steps:
      - name: Check out the exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      - name: Build the release twice, once with a machine's own Go settings
        id: build
        run: |
          set -eu
          pwsh -NoProfile -File scripts/release-build.ps1 -Version v0.0.0 -DryRun
          mv .work/release/v0.0.0 "${RUNNER_TEMP}/plain"
          # Settings a maintainer's shell or `go env -w` might carry. Each
          # changes the bytes, or breaks the build, if let through; the build
          # must ignore them all. Go 1.21.0 stands for any Go but go.mod's.
          mkdir -p "${RUNNER_TEMP}/config/go"
          printf 'GOARM64=v9.0\nGOFIPS140=latest\n' > "${RUNNER_TEMP}/config/go/env"
          XDG_CONFIG_HOME="${RUNNER_TEMP}/config" GOAMD64=v3 GOTOOLCHAIN=go1.21.0 CGO_ENABLED=1 GOFLAGS=-race \
            pwsh -NoProfile -File scripts/release-build.ps1 -Version v0.0.0 -DryRun
          diff -u "${RUNNER_TEMP}/plain/SHA256SUMS" .work/release/v0.0.0/SHA256SUMS
          echo "sums=$(sha256sum < "${RUNNER_TEMP}/plain/SHA256SUMS" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"

      - name: Check that the release check refuses wrong releases
        run: sh scripts/release-verify-test.sh "${RUNNER_TEMP}/plain"

  release-windows:
    name: Same release bytes on Windows
    needs: release-linux
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      # Windows PowerShell, as on the maintainer's machine, where releases are
      # built and signed.
      - name: Build the release
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/release-build.ps1 -Version v0.0.0 -DryRun
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Compare with the Linux build
        shell: bash
        env:
          LINUX: ${{ needs.release-linux.outputs.sums }}
        run: |
          set -eu
          have="$(sha256sum < .work/release/v0.0.0/SHA256SUMS | cut -d' ' -f1)"
          if [ "${have}" != "${LINUX}" ]; then
            echo "Windows built different bytes from Linux." >&2
            exit 1
          fi
          echo "Windows and Linux built the same bytes."

  analysis:
    name: Static and vulnerability analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      - name: Install pinned analysis tools outside the repository
        run: |
          set -eu
          export GOBIN="${RUNNER_TEMP}/mohur-tools"
          mkdir -p "${GOBIN}"
          # Build every tool with the pinned Go, which is at least the version
          # the tools read.
          GOTOOLCHAIN="go$(sed -n 's/^go //p' go.mod)"
          export GOTOOLCHAIN
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run static, security, vulnerability and workflow checks
        run: |
          set -eu
          GOTOOLCHAIN="go$(sed -n 's/^go //p' go.mod)"
          export GOTOOLCHAIN
          tools="${RUNNER_TEMP}/mohur-tools"
          "${tools}/staticcheck" ./cmd/... ./internal/... ./web/...
          "${tools}/gosec" -severity medium -confidence medium ./cmd/... ./internal/... ./web/...
          "${tools}/govulncheck" ./cmd/... ./internal/... ./web/...
          "${tools}/actionlint"
