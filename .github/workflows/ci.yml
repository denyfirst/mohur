name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No third-party actions. The checkout's short-lived token is used only to
# fetch, never stored in git configuration; tools are pinned by version or hash.
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      - name: Use the Go toolchain go.mod names
        run: echo "GOTOOLCHAIN=go$(sed -n 's/^go //p' go.mod)" >> "${GITHUB_ENV}"

      - name: Verify the toolchain and module files
        run: |
          set -eu
          test "$(go env GOVERSION)" = "${GOTOOLCHAIN}"
          go mod tidy
          test -z "$(git status --porcelain)"
          go mod verify
          go list -deps -test ./... > "${RUNNER_TEMP}/mohur-dependencies"
          if grep -qE '^golang.org/x/crypto/openpgp($|/)' "${RUNNER_TEMP}/mohur-dependencies"; then
            echo 'unmaintained OpenPGP dependency is forbidden' >&2
            exit 1
          fi

      - name: Format, vet, race-test and build
        run: |
          set -eu
          test -z "$(gofmt -l cmd internal web)"
          go vet ./...
          go test -race -shuffle=on -count=1 -timeout=5m ./...
          for platform in linux darwin windows; do
            GOOS="${platform}" go vet ./...
            GOOS="${platform}" go build -trimpath ./...
          done

      - name: Install the pinned Node
        run: |
          set -eu
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.3 \
            https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.xz \
            --output "${RUNNER_TEMP}/mohur-node.tar.xz"
          printf '%s  %s\n' 5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864 \
            "${RUNNER_TEMP}/mohur-node.tar.xz" | sha256sum -c -
          tar -xf "${RUNNER_TEMP}/mohur-node.tar.xz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/node-v26.13.1-linux-x64/bin" >> "${GITHUB_PATH}"

      - name: Run the app's tests against two real servers
        env:
          # The tests need libsignal, not the Electron binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          set -eu
          test "$(node --version)" = v26.13.1
          cd client
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
          node --test test/
          test -z "$(git status --porcelain)"

  install:
    name: Install on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      - name: Install, set up, upgrade and check the sandbox
        run: |
          set -eu
          GOTOOLCHAIN="go$(sed -n 's/^go //p' go.mod)"
          export GOTOOLCHAIN
          sh scripts/install-lab.sh

  analysis:
    name: Static and vulnerability analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact event commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch -q --depth 1 origin "${GITHUB_SHA}"
          unset auth
          git checkout -q FETCH_HEAD

      - name: Install pinned analysis tools outside the repository
        run: |
          set -eu
          export GOBIN="${RUNNER_TEMP}/mohur-tools"
          mkdir -p "${GOBIN}"
          # Build every tool with the pinned Go, which is at least the version
          # the tools read.
          GOTOOLCHAIN="go$(sed -n 's/^go //p' go.mod)"
          export GOTOOLCHAIN
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run static, security, vulnerability and workflow checks
        run: |
          set -eu
          GOTOOLCHAIN="go$(sed -n 's/^go //p' go.mod)"
          export GOTOOLCHAIN
          tools="${RUNNER_TEMP}/mohur-tools"
          "${tools}/staticcheck" ./cmd/... ./internal/... ./web/...
          "${tools}/gosec" -severity medium -confidence medium ./cmd/... ./internal/... ./web/...
          "${tools}/govulncheck" ./cmd/... ./internal/... ./web/...
          "${tools}/actionlint"
